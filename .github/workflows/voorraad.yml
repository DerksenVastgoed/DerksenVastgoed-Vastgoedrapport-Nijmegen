# De woningvoorraad van de zes ringbuurten ophalen, los van de brief.
#
# WAAROM DIT EEN EIGEN WORKFLOW IS. De twee voorraadfases zaten in de
# briefworkflow, achteraan. Dat gaf drie problemen.
#
# Ze konden de brief kosten. De weekeditie duurt 120 tot 298,6 minuten en de
# job stopt bij 330; met twee fases van 35 minuten erbij komt die op 368,6 en
# dan gaat er geen brief uit. Dat is op 10 oktober net voorkomen.
#
# Ze kostten drie uur per antwoord. Om te zien wat de BAG-fase doet moest de
# hele brief eerst langs pandgeschiedenis, en die nam 147 van de 163 minuten.
# Een fout in een fase van 35 minuten mag geen run van drie uur kosten om te
# bekijken.
#
# En ze hebben niets met de brief te maken. De voorraad vult een bestand dat
# de brief pas later gebruikt. Dat hoort niet in dezelfde job als iets dat om
# 02:48 de deur uit moet.
#
# Deze workflow doet alleen de voorraad. Hij draait op werkdagen na de brief en
# is met de hand te starten voor een snel antwoord.

name: Voorraad van de ring

on:
  schedule:
    # Maandag tot en met zaterdag om 04:40 UTC, ruim na de brief van 02:48 en
    # ruim voor de tweede poging van de brief. Zo botsen de twee niet om
    # dezelfde repo. Zondag niet: dan werkt de weekeditie van de brief de BAG
    # en alle labels zelf bij en bezet die de repo urenlang.
    #
    # Deze cron is terugval, geen regeling. Gemeten op 12 oktober 2026 vuurde
    # hij om 12:25 UTC, 7 uur en 45 minuten te laat. De geplande taak
    # "Voorraadronde op tijd starten" start de run om 03:18 UTC van buitenaf en
    # die begint binnen een halve minuut.
    #
    # Hier staat met opzet geen toets "is er vandaag al een ronde geweest",
    # anders dan bij de brief. Een tweede ronde op dezelfde dag stuurt niemand
    # een tweede mail; die vraagt alleen de volgende adressen op en brengt de
    # labeldekking verder. Dat is winst, niet dubbel werk.
    - cron: "40 4 * * 1-6"
  workflow_dispatch:
    inputs:
      bag_minuten:
        description: "Tijdbudget voor de objectronde in minuten. 0 slaat hem over."
        default: "10"
      panden_minuten:
        description: "Tijdbudget voor de pandronde in minuten. 0 slaat hem over."
        default: "10"
      labels_minuten:
        description: "Tijdbudget voor de labelfase in minuten. 0 slaat hem over."
        default: "90"
      ruwe_vbos:
        description: "Verblijfsobject-id's (komma's) ruw bij EP-Online opvragen en vastleggen. Leeg slaat over."
        default: ""

# Twee rondes tegelijk zouden elkaars bestand overschrijven.
concurrency:
  group: voorraad
  cancel-in-progress: false

jobs:
  voorraad:
    runs-on: ubuntu-latest
    # RUIMTE VOOR HET GROTERE LABELBUDGET. De objectronde deed er 176
    # seconden over en de pandronde 460, dus die twee kosten samen een
    # kwartier van hun twintig minuten budget. Met 90 minuten labels komt de
    # job op ongeveer 105 minuten, en dan is 120 te krap zodra er iets
    # langzamer gaat dan gemeten.
    timeout-minutes: 150
    permissions:
      contents: write
      # EN ISSUES, VOOR HET MELDKANAAL. Zie de laatste stap: als het
      # terugcommitten mislukt, is git juist het kanaal dat stuk is, en dan
      # is een issue het enige wat van buiten de run te lezen is.
      issues: write
    steps:
      - name: Repo ophalen
        uses: actions/checkout@v4

      - name: Python klaarzetten
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Dependencies installeren
        run: pip install requests

      - name: De zeef nameten voordat er iets wordt opgehaald
        # EERST DE PROEF, DAN HET WERK. Twee keer op 10 oktober leverde een
        # aanname over de vorm van een veld een lege voorraad op zonder dat er
        # iets faalde: gebruiksdoel bleek een string waar een lijst werd
        # verwacht, en pand staat als pand.href in het antwoord. Deze proef
        # draait op echte antwoordvormen, kost geen seconde en geen aanroep,
        # en is rood voordat er tien minuten in gaat zitten.
        run: |
          python voorraad_bag.py --proef
          # EN DE AANROEP VAN EP-ONLINE APART. Die stond drie keer in de repo
          # en de kopie die deze workflow gebruikte was stuk: hij vroeg alleen
          # op postcode en las een van de zes veldnamen waaronder het label
          # kan staan. Op 10 oktober leverde dat 818 aanroepen en nul labels
          # op, 25 minuten per run, en het zag eruit als een eigenschap van de
          # woningvoorraad in plaats van als een fout. Deze proef kost geen
          # seconde en geen aanroep.
          python eponline.py --proef

      - name: Een echt antwoord van EP-Online vastleggen
        # ALLEEN OP VERZOEK, en daarom met een lege standaard. Dit is geen
        # stap die de voorraad vult maar het gereedschap dat op 10 oktober
        # ontbrak: er was geen manier om naar één antwoord van EP-Online te
        # kijken, en daarom zag 818 aanroepen met nul labels eruit als een
        # eigenschap van de woningvoorraad.
        #
        # WAAROM HET NIET VANAF EEN WERKPLEK KAN. De sleutel staat hier, als
        # repo-secret, en nergens anders. Een proef op een werkplek kan dus
        # alleen de vorm meten die wij zelf hebben opgeschreven, en niet de
        # vorm die de API werkelijk geeft. Deze stap haalt dat verschil weg.
        #
        # EN WAAROM HET DOOR GIT TERUG MOET. De logserver van GitHub en de
        # blobserver voor artifacts zijn van buiten de run niet te lezen. Het
        # antwoord staat daarom in eponline_antwoordvorm.json, dat hieronder
        # wordt teruggecommit, en niet alleen in de log van deze stap.
        if: github.event.inputs.ruwe_vbos != ''
        env:
          EP_API_KEY: ${{ secrets.EP_API_KEY }}
        run: |
          python eponline.py --ruw --vbo "${{ github.event.inputs.ruwe_vbos }}"

      - name: Postcodes ophalen als er een ringbuurt bij is gekomen
        # De voorraad zeeft op de postcodes uit buurtinventaris.json. Komt er
        # een buurt bij in ring.py, dan kent die inventaris hem nog niet en
        # blijft de nieuwe buurt leeg tot de brief op zondag de inventaris
        # ververst. Zo begint de voorraad dezelfde dag. Kent de inventaris de
        # hele ring, dan kost deze stap een seconde en geen aanroep.
        continue-on-error: true
        run: |
          if python buurtinventaris.py --dekt-ring; then
            exit 0
          fi
          python buurtinventaris.py --proef
          python buurtinventaris.py

      - name: Oppervlakte en gebruiksdoel uit de BAG
        continue-on-error: true
        env:
          BAG_API_KEY: ${{ secrets.BAG_API_KEY }}
          EP_API_KEY: ${{ secrets.EP_API_KEY }}
        run: |
          MIN="${{ github.event.inputs.bag_minuten || '10' }}"
          PANDEN="${{ github.event.inputs.panden_minuten || '10' }}"
          if [ "$MIN" = "0" ]; then
            echo "Overgeslagen op verzoek"
            exit 0
          fi
          # Geen || echo: deze stap is het product van deze workflow, en een
          # mislukking hoort hier rood te zijn. continue-on-error zorgt dat de
          # labelfase en de commitstap daarna alsnog lopen, zodat de diagnose
          # in voorraad_stand.json wordt bewaard.
          python voorraad_bag.py --alleen bag --bag-minuten "$MIN" \
            --panden-minuten "$PANDEN"

      - name: Parkeerzones ophalen en zeggen wat erin zit
        continue-on-error: true
        run: |
          # DE VERKENNING EERST, want ik ken de veldnamen van deze laag niet:
          # services.nijmegen.nl is vanuit de werkomgeving niet te bereiken,
          # dus kan ik ze daar niet opzoeken. Een module die een veldnaam
          # raadt levert een parkeerzone op die klopt zolang niemand hem
          # nameet, en dat is deze week drie keer gebeurd.
          #
          # Het verslag gaat naar een bestand en niet alleen naar de log: het
          # joblogboek van GitHub zit achter een host die van buiten de runner
          # wordt geweigerd, dus zou de uitkomst onleesbaar zijn.
          set -o pipefail
          python parkeerzone.py --verken --uit parkeerzones_verslag.md \
            2>&1 | tee parkeerzone.log \
            || { echo "Parkeerzones overgeslagen"; \
                 echo "parkeerzones" >> "$GITHUB_WORKSPACE/overgeslagen.txt"; }

      - name: De zone bij elk pand zetten
        continue-on-error: true
        run: |
          # Alleen als de lagen er zijn. Zonder lagen gebeurt er niets, en dat
          # is beter dan een zone uit een half bestand.
          if [ ! -f parkeerzones.json ]; then
            echo "Geen parkeerzones.json; de zonekoppeling wordt overgeslagen"
            echo "zonekoppeling" >> "$GITHUB_WORKSPACE/overgeslagen.txt"
            exit 0
          fi
          set -o pipefail
          python parkeerzone.py --koppel 2>&1 | tee -a parkeerzone.log \
            || { echo "Zonekoppeling overgeslagen"; \
                 echo "zonekoppeling" >> "$GITHUB_WORKSPACE/overgeslagen.txt"; }

      - name: Energielabels uit EP-Online
        continue-on-error: true
        env:
          BAG_API_KEY: ${{ secrets.BAG_API_KEY }}
          EP_API_KEY: ${{ secrets.EP_API_KEY }}
        run: |
          MIN="${{ github.event.inputs.labels_minuten || '90' }}"
          if [ "$MIN" = "0" ]; then
            echo "Overgeslagen op verzoek"
            exit 0
          fi
          python voorraad_bag.py --alleen labels --labels-minuten "$MIN"

      - name: Wat er nu in de voorraad staat
        continue-on-error: true
        run: |
          # De stand in het logboek, zodat een mislukking hier te lezen is en
          # niet pas in het gezondheidsrapport van de volgende brief.
          python - <<'EOF'
          import json, os
          for pad in ("voorraad_stand.json", "voorraad.json"):
              if not os.path.exists(pad):
                  print(f"{pad} bestaat niet")
                  continue
              d = json.load(open(pad, encoding="utf-8"))
              if pad == "voorraad_stand.json":
                  print(json.dumps(d, ensure_ascii=False, indent=1)[:2000])
              else:
                  ad = d.get("adressen") or {}
                  nw = d.get("niet_woningen") or {}
                  print(f"voorraad.json: {len(ad)} woningen, {len(nw)} "
                        f"niet-woningen, "
                        f"{len(d.get('postcodes') or {})} postcodes gedaan, "
                        f"{sum(1 for r in ad.values() if r.get('oppervlakte'))}"
                        f" met oppervlakte, "
                        f"{sum(1 for r in ad.values() if r.get('label'))} met label")
                  # Een voorbeeld van een niet-woning, want juist dat vertelt
                  # hoe het veld gebruiksdoelen er werkelijk uitziet.
                  for k, r in list(nw.items())[:2]:
                      print(f"  voorbeeld {k}: {json.dumps(r, ensure_ascii=False)[:300]}")
          EOF

      - name: Voorraad terugcommitten
        # WAT ER OP EEN BRANCH WEL EN NIET TERUGKOMT. Op main gaan beide
        # bestanden terug, want dat is het product. Op een branch alleen de
        # stand van een paar kilobyte, en niet de voorraad van ruim vijf
        # megabyte: die zou uit een tussenversie van de code komen en elke
        # volgende push laten botsen. Dat is op 10 oktober twee keer gebeurd.
        #
        # EN WAAROM DIT NIET VIA HET LOGBOEK OF EEN ARTIFACT GAAT. Beide zijn
        # van buiten de run niet te lezen: de logserver van GitHub en de
        # blobserver waar artifacts op staan worden geweigerd. Git is het
        # enige kanaal dat werkt, dus de stand moet door git terug.
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          # DE UITVOER VAN DEZE STAP WORDT BEWAARD. Op 12 oktober mislukte
          # deze stap na een ronde van negentig minuten, en de reden stond
          # alleen in de log van de run. Die log zit achter een server die van
          # buiten wordt geweigerd, dus de oorzaak was niet te achterhalen:
          # alleen dat de stap twee seconden duurde. Daarom gaat alles nu ook
          # naar een bestand, dat de meldstap hieronder in een issue zet.
          set -o pipefail
          terugcommitten() {
          set -x
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          BESTANDEN="voorraad.json voorraad_stand.json eponline_antwoordvorm.json parkeerzones.json parkeerzones_verslag.md buurtinventaris.json"
          if [ "${GITHUB_REF_NAME}" != "${DEFAULT_BRANCH}" ]; then
            # Op een branch gaat de voorraad van ruim vijf megabyte niet terug
            # (die zou uit een tussenversie van de code komen), maar de stand
            # en het vastgelegde antwoord wel: samen een paar kilobyte, en het
            # zijn juist de twee bestanden waarvoor een branchrun wordt
            # gestart. Zonder het antwoord erbij is die run niet te lezen,
            # want de log is van buiten niet bereikbaar.
            BESTANDEN="voorraad_stand.json eponline_antwoordvorm.json parkeerzones_verslag.md"
            echo "Niet op ${DEFAULT_BRANCH}: alleen de stand en de antwoordvorm gaan terug"
          fi
          for f in $BESTANDEN; do
            if [ -f "$f" ]; then
              git add "$f"
              echo "  $f ($(wc -c < "$f") bytes)"
            else
              echo "  $f ONTBREEKT"
            fi
          done
          if git diff --cached --quiet; then
            echo "Niets gewijzigd, niets te committen"
            return 0
          fi
          git commit -m "Voorraad $(date +%F)"
          # OPNIEUW BOVENOP DE REMOTE ZETTEN, NIET REBASEN. Hier stond een
          # lus met "git pull --rebase --autostash || true", en op 12 oktober
          # kostte dat een ronde van negentig minuten. Nagemaakt in een
          # sandbox, met deze uitkomst in een seconde:
          #
          #   poging 1: push geweigerd
          #             git pull --rebase -> CONFLICT in voorraad.json
          #   poging 2: fatal: You are not currently on a branch.
          #   poging 3: idem
          #
          # De mislukte rebase werd ingeslikt door de "|| true", de repo bleef
          # halverwege een rebase staan, en daardoor faalden de volgende twee
          # pushes direct. Een geplande run gebruikt de commit van het moment
          # waarop hij werd AANGEMAAKT, dus bij twee rondes op een dag is zijn
          # basis altijd verschoven en botst hij op voorraad.json.
          #
          # Rebasen is hier ook het verkeerde gereedschap. Deze bestanden
          # worden in hun geheel door de ronde gemaakt en niet regel voor
          # regel bijgewerkt, dus er valt niets samen te voegen: de nieuwste
          # ronde heeft alles wat de vorige had en meer. Daarom: de index met
          # ONZE bestanden houden, HEAD naar de remote zetten, en opnieuw
          # committen. Dan is de push altijd een fast-forward en kan er geen
          # conflict bestaan. Alleen de bestanden die wij hebben toegevoegd
          # zitten in die index, dus de rest van de repo blijft zoals de
          # remote hem heeft.
          # EEN GEGEVENSCOMMIT RAAKT NOOIT BRONCODE. Deze toets staat los van
          # de lijst hierboven en van de resetmodus eronder: wat er ook gebeurt,
          # een ronde die data terugschrijft mag geen .py of .yml veranderen.
          # Op 13 oktober deed hij dat wel, en dat was aan niets te zien.
          geen_broncode() {
            local raakt
            raakt=$(git diff --name-only HEAD~1 HEAD -- '*.py' '*.yml' 2>/dev/null || true)
            if [ -n "$raakt" ]; then
              echo "GESTOPT: deze commit raakt broncode: $raakt"
              echo "Een ronde die gegevens terugschrijft hoort geen code te veranderen."
              return 1
            fi
            return 0
          }
          for poging in 1 2 3; do
            geen_broncode || return 1
            if git push; then
              echo "Teruggecommit gelukt"
              return 0
            fi
            echo "Push mislukt, poging $poging; opnieuw bovenop de remote"
            # Een half afgebroken rebase van een eerdere poging opruimen,
            # want die laat de repo los van elke branch staan.
            git rebase --abort 2>/dev/null || true
            # Met een eigen melding erbij. Zonder deze regel sterft de stap
            # op een kale gitcode 128 als de branch niet op de remote staat,
            # en dan staat er in het issue geen reden maar een cijfer.
            if ! git fetch origin "${GITHUB_REF_NAME}"; then
              echo "Kan ${GITHUB_REF_NAME} niet ophalen van de remote; staat die branch daar wel?"
              return 1
            fi
            # MIXED EN NIET SOFT, EN DAARNA NAMETEN.
            #
            # Hier stond "git reset --soft", met het commentaar hierboven dat
            # alleen onze eigen bestanden in de index zouden zitten. Dat is
            # precies wat --soft NIET doet: die zet alleen HEAD en laat de
            # hele index van de oude checkout staan. De commit schrijft die
            # index als nieuwe boom, dus elk bestand dat tijdens de ronde op
            # de remote veranderde, wordt teruggedraaid naar de versie van het
            # moment waarop de ronde begon.
            #
            # Op 13 oktober gebeurde dat. De ronde van 07:04 duurde 102
            # minuten; in dat uur werden PR 56 en PR 57 gemerged. Zijn commit
            # van 08:46 draaide beide volledig terug: zes broncodebestanden en
            # drie eisen. Alle proeven bleven groen, want de eisen die ernaar
            # verwezen waren met dezelfde commit verdwenen.
            #
            # Nagemaakt in een sandbox, in een seconde:
            #   --soft:  code.py na de commit = "versie 1"  (fix verdwenen)
            #   mixed :  code.py na de commit = "versie 2 MET MIJN FIX"
            #
            # En dan nog nameten dat de commit werkelijk niets buiten de lijst
            # aanraakt. Een reset-modus is te makkelijk terug te draaien; deze
            # toets houdt het tegen, wat voor reset er ook boven staat.
            git reset "origin/${GITHUB_REF_NAME}"
            for f in $BESTANDEN; do
              [ -f "$f" ] && git add "$f"
            done
            LIJST=" $(echo $BESTANDEN) "
            VREEMD=""
            for f in $(git diff --cached --name-only); do
              case "$LIJST" in
                *" $f "*) ;;
                *) VREEMD="$VREEMD $f" ;;
              esac
            done
            if [ -n "$VREEMD" ]; then
              echo "GESTOPT: deze commit zou bestanden buiten de lijst veranderen:$VREEMD"
              echo "Dat is de fout van 13 oktober: een ronde draait werk terug"
              echo "dat tijdens zijn looptijd is gemerged."
              return 1
            fi
            if git diff --cached --quiet; then
              echo "Na het bijtrekken is er niets meer te committen"
              return 0
            fi
            git commit -m "Voorraad $(date +%F)"
          done
          echo "Terugcommitten mislukt na drie pogingen"
          return 1
          }
          terugcommitten 2>&1 | tee /tmp/terugcommit.log
          exit "${PIPESTATUS[0]}"

      - name: Melden in een issue als er iets is mislukt
        # WAAROM DIT EEN ISSUE IS EN GEEN REGEL IN DE LOG. Op 12 oktober
        # mislukte het terugcommitten na negentig minuten labelwerk. De reden
        # stond in de log van de run, en die log zit achter
        # results-receiver.actions.githubusercontent.com, die van buiten wordt
        # geweigerd. Van buiten was dus alleen te zien DAT de stap faalde en
        # dat hij twee seconden duurde, niet waarom.
        #
        # Het diepere probleem: onze diagnose en onze levering liepen beide
        # door git. Faalt git, dan verliezen we allebei. De API van GitHub is
        # wel bereikbaar, dus een issue is het kanaal dat overblijft.
        #
        # Het verslag van de ronde gaat mee. Dat staat op de schijf van de
        # runner, ook als het pushen mislukt, dus zo komen de getallen van een
        # verloren ronde alsnog terug.
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          KOP="Voorraadronde mislukt op $(date +%F)"
          {
            echo "Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            echo "Aanleiding: ${{ github.event_name }}"
            echo ""
            echo "## De laatste regels van het terugcommitten"
            echo '```'
            tail -c 3000 /tmp/terugcommit.log 2>/dev/null || echo "(geen log; de stap is niet eens begonnen)"
            echo '```'
            echo ""
            echo "## Het verslag van de ronde, van de schijf van de runner"
            echo '```json'
            head -c 2500 voorraad_stand.json 2>/dev/null || echo "(voorraad_stand.json ontbreekt)"
            echo '```'
            echo ""
            echo "_Automatisch gemeld omdat de log van een run van buiten niet te lezen is._"
          } > /tmp/melding.md
          # EEN ISSUE PER DAG EN NIET PER RONDE. Mislukt het twee keer op een
          # dag, dan komt er een reactie onder hetzelfde issue in plaats van
          # een tweede issue. Een stapel identieke issues leest niemand, en
          # dat is dezelfde fout als een foutenteller die altijd oploopt.
          BESTAAND=$(gh issue list --state open --search "$KOP in:title" \
            --json number --jq '.[0].number' 2>/dev/null || true)
          if [ -n "$BESTAAND" ] && [ "$BESTAAND" != "null" ]; then
            gh issue comment "$BESTAAND" --body-file /tmp/melding.md
            echo "Reactie geplaatst onder issue #$BESTAAND"
          else
            gh issue create --title "$KOP" --body-file /tmp/melding.md
          fi
