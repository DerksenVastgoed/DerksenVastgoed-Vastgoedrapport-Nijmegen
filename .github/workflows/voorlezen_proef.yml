# TIJDELIJK, alleen op de tak claude/2026-10-20-voorlezen: maakt van elke
# Nederlandse Piper-stem een fragment en van het verhaal van 20 oktober de hele
# MP3, mailt die alleen naar Mark, en zet de metingen in voorlezen_proef.txt.
# Gaat weer van de tak af voordat hij naar main gaat.
name: Voorlezen proef
on:
  push:
    branches: [claude/2026-10-20-voorlezen]
    paths: [.github/workflows/voorlezen_proef.yml]
permissions:
  contents: write
jobs:
  proef:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Installeren
        run: pip install -q -r requirements.txt piper-tts
      - name: Monsters en de hele brief
        run: |
          set -o pipefail
          { echo "== monsters"; python voorlezen.py --monsters monsters --verhaal digests/2026-10-20-verhaal.md 2>&1
            echo "== hele verhaal"; /usr/bin/time -v python voorlezen.py --datum 2026-10-20 2>&1 | grep -v "^\s" ;
            ls -la digests/*.mp3 monsters/; } | tee voorlezen_proef.txt || true
      # De mail ging in de eerste run al naar Mark; deze run meet alleen.
      - name: Metingen terugzetten op de tak
        if: always()
        run: |
          git config user.name "vastgoedmonitor-bot"
          git config user.email "bot@users.noreply.github.com"
          cp monsters/LEESMIJ.txt voorlezen_stemmen.txt 2>/dev/null || true
          git add voorlezen_proef.txt voorlezen_stemmen.txt
          git commit -m "Voorlezen proef: metingen" && git pull --rebase origin "${GITHUB_REF_NAME}" && git push
