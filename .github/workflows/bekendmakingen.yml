name: Bekendmakingen Nijmegen

on:
  schedule:
    - cron: "0 5 * * 1-5"   # 05:00 UTC op werkdagen = 07:00 zomer / 06:00 winter NL
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  digest:
    runs-on: ubuntu-latest
    steps:
      - name: Repo ophalen
        uses: actions/checkout@v4

      - name: Python klaarzetten
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Dependencies installeren
        run: pip install -r requirements.txt

      - name: Bekendmakingen ophalen
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          mkdir -p digests
          DATUM=$(date +%F)
          python bekendmakingen_nijmegen.py --dagen 2 --uit "digests/$DATUM-bekendmakingen.md"
          echo "DATUM=$DATUM" >> "$GITHUB_ENV"

      - name: Buurten-tabel bijwerken
        run: |
          python buurten_tabel.py --uit "digests/${DATUM}-buurten.md" || echo "Tabel-stap overgeslagen"

      - name: Rente ophalen
        run: |
          python rente_verhuurhypotheek.py --uit "digests/${DATUM}-rente.md" || echo "Rente-stap overgeslagen"

      - name: Brief samenstellen
        run: |
          BRIEF="digests/${DATUM}-brief.md"
          {
            echo "# Vastgoedbrief Nijmegen - $(date +%d-%m-%Y)"
            echo ""
            echo "[Bekijk de eigendomskaart](https://derksenvastgoed.github.io/DerksenVastgoed-Vastgoedrapport-Nijmegen/kaart-eigendom-ring.html)"
            echo ""
            echo "---"
            echo ""
            if [ -f "digests/${DATUM}-rente.md" ]; then
              cat "digests/${DATUM}-rente.md"
              echo ""
              echo "---"
              echo ""
            fi
            cat "digests/${DATUM}-bekendmakingen.md"
            echo ""
            echo "---"
            echo ""
            if [ -f "digests/${DATUM}-buurten.md" ]; then
              cat "digests/${DATUM}-buurten.md"
            fi
          } > "$BRIEF"
          # Kies een uniek eindteken dat niet in de brief kan voorkomen
          EOF_MARK="EOF_$(date +%s%N)"
          {
            echo "BRIEF<<${EOF_MARK}"
            cat "$BRIEF"
            echo "${EOF_MARK}"
          } >> "$GITHUB_ENV"

      - name: Digests + rentehistorie terugcommitten
        run: |
          git config user.name "vastgoedmonitor-bot"
          git config user.email "bot@users.noreply.github.com"
          git add digests/ rente_historie.json 2>/dev/null || true
          git commit -m "Brief ${{ env.DATUM }}" || echo "Niets nieuws vandaag"
          git push

      - name: Brief mailen
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          from: Vastgoedmonitor Nijmegen <${{ secrets.MAIL_USERNAME }}>
          to: ${{ secrets.MAIL_TO }}
          subject: Vastgoedbrief Nijmegen ${{ env.DATUM }}
          body: ${{ env.BRIEF }}
