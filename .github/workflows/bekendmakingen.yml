name: Bekendmakingen Nijmegen

on:
  schedule:
    - cron: "0 5 * * 1-5"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  digest:
    runs-on: ubuntu-latest
    steps:
      - name: Repo ophalen
        uses: actions/checkout@v4

      - name: Python klaarzetten
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Dependencies installeren
        run: pip install -r requirements.txt

      - name: Bekendmakingen ophalen
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          BAG_API_KEY: ${{ secrets.BAG_API_KEY }}
        run: |
          mkdir -p digests
          DATUM=$(date +%F)
          python bekendmakingen_nijmegen.py --dagen 2 --uit "digests/$DATUM-bekendmakingen.md"
          echo "DATUM=$DATUM" >> "$GITHUB_ENV"

      - name: Buurten-tabel bijwerken
        run: |
          python buurten_tabel.py --uit "digests/${DATUM}-buurten.md" || echo "Tabel-stap overgeslagen"

      - name: Rente ophalen
        run: |
          python rente_verhuurhypotheek.py --uit "digests/${DATUM}-rente.md" || echo "Rente-stap overgeslagen"

      - name: Publicaties ophalen
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          python publicaties_vastgoed.py --uit "digests/${DATUM}-publicaties.md" || echo "Publicaties-stap overgeslagen"

      - name: Bekendmakingen-archief bijwerken
        run: |
          VANAF=$(date -d "-7 days" +%F)
          python bekendmakingen_archief.py --vanaf "$VANAF" --stil || echo "Archief-stap overgeslagen"

      - name: Marktprijzen (BAG) verrijken
        env:
          BAG_API_KEY: ${{ secrets.BAG_API_KEY }}
        run: |
          python marktprijzen_bag.py --uit "digests/${DATUM}-marktprijzen.md" --input verkopen.txt || echo "Marktprijzen-stap overgeslagen"

      - name: Brief samenstellen
        run: |
          BRIEF="digests/${DATUM}-brief.md"
          {
            echo "[Bekijk de eigendomskaart](https://derksenvastgoed.github.io/DerksenVastgoed-Vastgoedrapport-Nijmegen/kaart-eigendom-ring.html)"
            echo ""
            echo "---"
            echo ""
            cat "digests/${DATUM}-bekendmakingen.md"
            echo ""
            echo "---"
            echo ""
            if [ -f "digests/${DATUM}-publicaties.md" ]; then
              cat "digests/${DATUM}-publicaties.md"
              echo ""
              echo "---"
              echo ""
            fi
            if [ -f "digests/${DATUM}-rente.md" ]; then
              cat "digests/${DATUM}-rente.md"
              echo ""
              echo "---"
              echo ""
            fi
            if [ -f "digests/${DATUM}-marktprijzen.md" ]; then
              cat "digests/${DATUM}-marktprijzen.md"
              echo ""
              echo "---"
              echo ""
            fi
            if [ -f "digests/${DATUM}-buurten.md" ]; then
              cat "digests/${DATUM}-buurten.md"
            fi
          } > "$BRIEF"
          echo "BRIEF_PAD=$BRIEF" >> "$GITHUB_ENV"

      - name: Brief naar HTML converteren
        run: |
          pip install markdown
          HTML_PAD="digests/${DATUM}-brief.html"
          python -c "
          import markdown, sys
          md = open('${{ env.BRIEF_PAD }}', encoding='utf-8').read()
          body = markdown.markdown(md, extensions=['tables', 'nl2br'])
          css = '''
          <style>
            body { font-family: -apple-system, Segoe UI, Roboto, sans-serif; color: #1a2830; line-height: 1.55; max-width: 780px; margin: 0 auto; padding: 20px; }
            h1 { font-size: 22px; border-bottom: 2px solid #E0A458; padding-bottom: 6px; }
            h2 { font-size: 17px; color: #12242c; margin-top: 28px; }
            h3, h4 { font-size: 14px; margin-top: 18px; }
            table { border-collapse: collapse; margin: 12px 0; width: 100%; }
            th, td { border: 1px solid #d0d7dc; padding: 6px 10px; text-align: left; font-size: 13px; }
            th { background: #f2f5f7; }
            a { color: #4a7a72; text-decoration: none; }
            a:hover { text-decoration: underline; }
            hr { border: none; border-top: 1px solid #d0d7dc; margin: 24px 0; }
            em { color: #4a5b63; }
            code { background: #f2f5f7; padding: 1px 4px; border-radius: 3px; }
          </style>
          '''
          html = f'<!DOCTYPE html><html><head><meta charset=\"utf-8\">{css}</head><body>{body}</body></html>'
          open('$HTML_PAD', 'w', encoding='utf-8').write(html)
          "
          echo "HTML_PAD=$HTML_PAD" >> "$GITHUB_ENV"

      - name: Digests + rentehistorie + cache terugcommitten
        run: |
          git config user.name "vastgoedmonitor-bot"
          git config user.email "bot@users.noreply.github.com"
          git add digests/ rente_historie.json publicaties_gezien.json marktprijzen_bag_cache.json bekendmakingen_archief.json 2>/dev/null || true
          git commit -m "Brief ${{ env.DATUM }}" || echo "Niets nieuws vandaag"
          git push

      - name: Brief mailen
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          from: Vastgoedmonitor Nijmegen <${{ secrets.MAIL_USERNAME }}>
          to: ${{ secrets.MAIL_TO }}
          subject: Vastgoedbrief Nijmegen ${{ env.DATUM }}
          html_body: file://${{ env.HTML_PAD }}
          convert_markdown: false
