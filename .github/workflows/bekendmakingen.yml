name: Bekendmakingen Nijmegen

on:
  schedule:
    - cron: "17 3 * * 1-5"  # werkdagen: korte brief (niet op het hele uur,
                            # want dan staat de wachtrij bij GitHub vol)
    - cron: "23 4 * * 0"    # zondag: uitgebreide brief
  workflow_dispatch:
    inputs:
      backfill_vanaf:
        description: "Eenmalige backfill van het bekendmakingen-archief, bijvoorbeeld 2012-01-01. Leeg laten voor een gewone run."
        required: false
        default: ""
      backfill_tot:
        description: "Einddatum van de backfill, bijvoorbeeld 2018-07-01. Leeg laten voor vandaag."
        required: false
        default: ""
      sru_pauze:
        description: "Seconden tussen bevragingen. Bij 503-fouten hoger zetten, bijvoorbeeld 3."
        required: false
        default: "1"

permissions:
  contents: write

jobs:
  digest:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - name: Repo ophalen
        uses: actions/checkout@v4

      - name: Python klaarzetten
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Dependencies installeren
        run: pip install -r requirements.txt

      - name: Bekendmakingen ophalen
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          BAG_API_KEY: ${{ secrets.BAG_API_KEY }}
          EP_API_KEY: ${{ secrets.EP_API_KEY }}
          VERHAAL_ADRES: ${{ secrets.MAIL_TO_VERHAAL }}
        run: |
          mkdir -p digests
          DATUM=$(date +%F)
          # Zondag is dag 7. Dan de uitgebreide brief, doordeweeks de korte.
          if [ "$(date +%u)" = "7" ]; then MODUS=weekelijks; else MODUS=dagelijks; fi
          echo "MODUS=$MODUS" >> "$GITHUB_ENV"
          if [ -n "${VERHAAL_ADRES}" ]; then
            echo "HEEFT_VERHAAL=1" >> "$GITHUB_ENV"
          else
            echo "HEEFT_VERHAAL=0" >> "$GITHUB_ENV"
          fi
          echo "Modus: $MODUS"
          python bekendmakingen_nijmegen.py --dagen 2 --modus "$MODUS" \
            --uit "digests/$DATUM-bekendmakingen.md" \
            || echo "Bekendmakingen-stap overgeslagen"
          echo "DATUM=$DATUM" >> "$GITHUB_ENV"

      - name: Vergunningen aan buurten koppelen (alleen als het bestand ontbreekt)
        continue-on-error: true
        run: |
          # Straten verhuizen niet, dus dit hoeft maar een keer. Verwijder
          # vergunningen_per_buurt.json om opnieuw te koppelen.
          if [ ! -s vergunningen_per_buurt.json ] && [ -s kamervergunningen.json ]; then
            python vergunningen_buurten.py || echo "Buurtkoppeling overgeslagen"
          else
            echo "Buurtkoppeling aanwezig of geen vergunningenlijst, overslaan"
          fi

      - name: Misdrijfcijfers verversen (alleen als het bestand ontbreekt)
        continue-on-error: true
        run: |
          # Jaarcijfers, dus eens per jaar ophalen is genoeg. Wil je verversen,
          # verwijder dan misdrijven_per_buurt.json.
          if [ ! -s misdrijven_per_buurt.json ]; then
            python misdrijven_buurt.py --jaren 3 || echo "Misdrijven-stap overgeslagen"
          else
            echo "Misdrijfcijfers aanwezig, overslaan"
          fi

      - name: Buurtcijfers verversen
        run: |
          # Levert buurten_cbs.json, dat het marktprijzen-script per buurt toont
          # bij het aanbod. De losse tabel staat niet meer in de brief.
          python buurten_tabel.py --uit "digests/${DATUM}-buurten.md" || echo "Buurten-stap overgeslagen"

      - name: Rente ophalen
        run: |
          python rente_verhuurhypotheek.py --modus "$MODUS" --uit "digests/${DATUM}-rente.md" || echo "Rente-stap overgeslagen"

      - name: Regelgeving controleren op wijzigingen
        continue-on-error: true
        run: |
          # De verordeningen en wetten waarop de brief rekent. Wekelijks is
          # genoeg: een verordening verandert niet dagelijks.
          if [ "$MODUS" != "dagelijks" ] || [ ! -s regelgeving_status.json ]; then
            python regelgeving_monitor.py --uit regelgeving_wijzigingen.md \
              || echo "Regelgeving-stap overgeslagen"
          else
            echo "Regelgeving wordt op zondag gecontroleerd"
          fi

      - name: Publicaties ophalen
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          python publicaties_vastgoed.py --uit "digests/${DATUM}-publicaties.md" || echo "Publicaties-stap overgeslagen"

      # Eenmalig een volledige backfill draaien voor de leefbaarheidstoets:
      #   python bekendmakingen_archief.py --vanaf 2012-01-01
      # Dat duurt lang en hoeft maar een keer; daarna volstaat de dagelijkse stap.
      - name: Archief backfill (alleen bij handmatige start met een datum)
        if: ${{ github.event.inputs.backfill_vanaf != '' }}
        continue-on-error: true
        env:
          SRU_PAUZE: ${{ github.event.inputs.sru_pauze }}
        run: |
          TOT="${{ github.event.inputs.backfill_tot }}"
          echo "Backfill vanaf ${{ github.event.inputs.backfill_vanaf }} tot ${TOT:-vandaag}"
          if [ -n "$TOT" ]; then
            python bekendmakingen_archief.py \
              --vanaf "${{ github.event.inputs.backfill_vanaf }}" --tot "$TOT"
          else
            python bekendmakingen_archief.py \
              --vanaf "${{ github.event.inputs.backfill_vanaf }}" --stil
          fi

      - name: Bekendmakingen-archief bijwerken
        run: |
          VANAF=$(date -d "-7 days" +%F)
          python bekendmakingen_archief.py --vanaf "$VANAF" --stil || echo "Archief-stap overgeslagen"

      - name: Funda-attenderingen uitlezen
        env:
          MAIL_USERNAME: ${{ secrets.MAIL_USERNAME }}
          MAIL_PASSWORD: ${{ secrets.MAIL_PASSWORD }}
        run: |
          python funda_mail.py --dagen 3 || echo "Funda-mail-stap overgeslagen"

      - name: Rijksmonumenten ophalen (alleen als het bestand ontbreekt)
        run: |
          # Deze stap duurt ongeveer drie kwartier, want de RCE levert linked data
          # die pagina voor pagina doorlopen moet worden. Het register verandert
          # nauwelijks, dus we halen het alleen op als het bestand er niet is.
          # Wil je handmatig verversen: verwijder rijksmonumenten_nijmegen.json.
          GROOTTE=0
          if [ -f rijksmonumenten_nijmegen.json ]; then
            GROOTTE=$(wc -c < rijksmonumenten_nijmegen.json)
          fi
          if [ "$GROOTTE" -lt 200 ]; then
            echo "Monumentenbestand ontbreekt of is leeg ($GROOTTE bytes), ophalen"
            python rijksmonumenten.py || echo "Monumenten-stap overgeslagen"
          else
            echo "Monumentenbestand aanwezig ($GROOTTE bytes), overslaan"
          fi

      - name: Marktprijzen (BAG) verrijken
        env:
          BAG_API_KEY: ${{ secrets.BAG_API_KEY }}
          EIGEN_VERMOGEN: ${{ secrets.EIGEN_VERMOGEN }}
          EP_API_KEY: ${{ secrets.EP_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          python marktprijzen_bag.py --modus "$MODUS" \
            --uit "digests/${DATUM}-marktprijzen.md" \
            --bijlage "digests/${DATUM}-bijlage.md" \
            --input verkopen.txt || echo "Marktprijzen-stap overgeslagen"

      - name: Achtergrond en bronnen klaarzetten
        continue-on-error: true
        run: |
          python bronnen.py --achtergrond --uit achtergrond_vandaag.md \
            > /dev/null || echo "Achtergrond overgeslagen"
          if [ "$MODUS" = "dagelijks" ]; then
            python bronnen.py --kort --uit bronnen_vandaag.md > /dev/null \
              || echo "Bronnen overgeslagen"
          else
            python bronnen.py --uit bronnen_vandaag.md > /dev/null \
              || echo "Bronnen overgeslagen"
          fi

      - name: Brief samenstellen
        continue-on-error: true
        run: |
          BRIEF="digests/${DATUM}-brief.md"
          {
            # De kaartlink zit nu in de introtekst van het aanbodblok
            # Per gebied: aanbod met de gemeentelijke berichten erbij
            if [ -s "digests/${DATUM}-marktprijzen.md" ]; then
              cat "digests/${DATUM}-marktprijzen.md"
              echo ""
              echo "---"
              echo ""
            else
              # Vangnet: is het aanbodblok er niet, toon dan de bekendmakingen los
              cat "digests/${DATUM}-bekendmakingen.md"
              echo ""
              echo "---"
              echo ""
            fi
            # Algemeen nieuws, met daarachter de berichten zonder herkenbare buurt
            if [ -s "digests/${DATUM}-publicaties.md" ]; then
              cat "digests/${DATUM}-publicaties.md"
              if [ -s overige_berichten.md ]; then
                echo ""
                cat overige_berichten.md
              fi
              echo ""
              echo "---"
              echo ""
            elif [ -s overige_berichten.md ]; then
              echo "## Publicaties"
              echo ""
              cat overige_berichten.md
              echo ""
              echo "---"
              echo ""
            fi
            if [ -s regelgeving_wijzigingen.md ]; then
              cat regelgeving_wijzigingen.md
              echo ""
              echo "---"
              echo ""
              rm -f regelgeving_wijzigingen.md
            fi
            if [ -s beleid_vandaag.md ]; then
              cat beleid_vandaag.md
              echo ""
              echo "---"
              echo ""
            fi
            if [ -s "digests/${DATUM}-rente.md" ]; then
              cat "digests/${DATUM}-rente.md"
              echo ""
            fi
            if [ -s achtergrond_vandaag.md ]; then
              echo "## Achtergrond van de dag"
              cat achtergrond_vandaag.md
              echo ""
              rm -f achtergrond_vandaag.md
            fi
            if [ -s bronnen_vandaag.md ]; then
              echo ""
              echo "---"
              cat bronnen_vandaag.md
              rm -f bronnen_vandaag.md
            fi
          } > "$BRIEF"
          echo "BRIEF_PAD=$BRIEF" >> "$GITHUB_ENV"

      - name: Verhalende brief maken
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          BRIEF_AANHEF: ${{ secrets.BRIEF_AANHEF }}
        run: |
          python brief_verhalend.py --datum "$DATUM" \
            --uit "digests/${DATUM}-verhaal.md" || echo "Verhalende brief overgeslagen"
          if [ -s "digests/${DATUM}-verhaal.md" ]; then
            echo "Brief gemaakt: $(wc -w < "digests/${DATUM}-verhaal.md") woorden"
          else
            echo "LET OP: er is geen verhalende brief gemaakt"
          fi

      - name: Brief en bijlage samenvoegen tot een HTML
        continue-on-error: true
        run: |
          python - << 'EOF'
          import markdown, os
          d = os.environ["DATUM"]

          def lees(pad):
              try:
                  with open(pad, encoding="utf-8") as f:
                      return f.read().strip()
              except Exception:
                  return ""

          verhaal = lees(f"digests/{d}-verhaal.md")
          # De bijlage is de tabelversie; valt die weg, dan de hele werkbrief
          werk = lees(f"digests/{d}-bijlage.md") or lees(f"digests/{d}-brief.md")

          # De brief bovenaan om rustig te lezen, de cijfers eronder als
          # bijlage om in te duiken. Een mail in plaats van twee.
          delen = []
          if verhaal:
              delen.append(markdown.markdown(verhaal, extensions=["extra"]))
              if werk:
                  delen.append('<hr><h1 id="bijlage">Bijlage: de cijfers</h1>'
                               '<p class="inleiding">Het volledige overzicht per '
                               'buurt, met de panden die nu worden aangeboden, de '
                               'doorrekening en de gemeentelijke berichten.</p>')
          if werk:
              delen.append(markdown.markdown(werk, extensions=["extra", "tables"]))

          stijl = (
            "body{font:17px/1.75 Georgia,'Times New Roman',serif;color:#1a2830;"
            "max-width:700px;margin:0 auto;padding:28px}"
            "h1{font-size:21px;font-weight:normal;color:#4a5b63;"
            "border-bottom:2px solid #E0A458;padding-bottom:10px;margin-top:40px}"
            "h2{font-size:17px;color:#12242c;margin:32px 0 10px;"
            "border-bottom:1px solid #e3e8ea;padding-bottom:6px}"
            "h3{font-size:16px;color:#12242c;margin:26px 0 8px}"
            "p{margin:0 0 18px}a{color:#4a7a72}"
            "hr{border:0;border-top:2px solid #e3e8ea;margin:48px 0 8px}"
            ".inleiding{color:#4a5b63;font-size:15px}"
            "table{border-collapse:collapse;width:100%;font:14px/1.5 "
            "-apple-system,Segoe UI,sans-serif;margin:0 0 18px}"
            "th{text-align:left;border-bottom:2px solid #12242c;padding:6px 8px}"
            "td{border-bottom:1px solid #e3e8ea;padding:6px 8px;vertical-align:top}"
            "em{color:#4a5b63;font-size:15px}")

          with open(f"digests/{d}-mail.html", "w", encoding="utf-8") as f:
              f.write("<!DOCTYPE html><html lang=nl><head><meta charset=utf-8>"
                      f"<style>{stijl}</style></head><body>"
                      + "".join(delen) + "</body></html>")
          print(f"Mail samengesteld: verhaal {len(verhaal.split())} woorden, "
                f"bijlage {len(werk.split())} woorden")
          EOF

      - name: Brief naar HTML converteren
        continue-on-error: true
        run: |
          pip install markdown
          HTML_PAD="digests/${DATUM}-brief.html"
          python -c "
          import markdown, sys
          md = open('${{ env.BRIEF_PAD }}', encoding='utf-8').read()
          body = markdown.markdown(md, extensions=['tables', 'nl2br'])
          css = '''
          <style>
            body { font-family: -apple-system, Segoe UI, Roboto, sans-serif; color: #1a2830; line-height: 1.55; max-width: 780px; margin: 0 auto; padding: 20px; }
            h1 { font-size: 22px; border-bottom: 2px solid #E0A458; padding-bottom: 6px; }
            h2 { font-size: 17px; color: #12242c; margin-top: 28px; }
            h3, h4 { font-size: 14px; margin-top: 18px; }
            table { border-collapse: collapse; margin: 12px 0; width: 100%; }
            th, td { border: 1px solid #d0d7dc; padding: 6px 10px; text-align: left; font-size: 13px; }
            th { background: #f2f5f7; }
            a { color: #4a7a72; text-decoration: none; }
            a:hover { text-decoration: underline; }
            hr { border: none; border-top: 1px solid #d0d7dc; margin: 24px 0; }
            em { color: #4a5b63; }
            code { background: #f2f5f7; padding: 1px 4px; border-radius: 3px; }
          </style>
          '''
          html = f'<!DOCTYPE html><html><head><meta charset=\"utf-8\">{css}</head><body>{body}</body></html>'
          open('$HTML_PAD', 'w', encoding='utf-8').write(html)
          "
          echo "HTML_PAD=$HTML_PAD" >> "$GITHUB_ENV"
          if [ "$MODUS" = "weekelijks" ]; then
            echo "ONDERWERP=Vastgoedbrief Nijmegen ${DATUM} (weekoverzicht)" >> "$GITHUB_ENV"
          else
            echo "ONDERWERP=Vastgoedbrief Nijmegen ${DATUM}" >> "$GITHUB_ENV"
          fi

      - name: Digests + gegevensbestanden terugcommitten
        run: |
          git config user.name "vastgoedmonitor-bot"
          git config user.email "bot@users.noreply.github.com"

          # Alles wat de scripts wegschrijven en wat bewaard moet blijven.
          # Staat een bestand hier niet in, dan is het na de run verdwenen.
          BESTANDEN="
            verkopen.txt
            woz.txt
            huidige_huur.txt
            brief_gezien.json
            regelgeving_status.json
            weetjes_gezien.json
            achtergrond_gezien.json
            prijstrend.json
            misdrijven_per_buurt.json
            kamervergunningen.json
            vergunningen_per_buurt.json
            straat_buurt_cache.json
            rente_actueel.json
            rente_historie.json
            buurten_cbs.json
            bekendmakingen_vandaag.json
            bekendmakingen_archief.json
            publicaties_gezien.json
            marktprijzen_bag_cache.json
            rijksmonumenten_nijmegen.json
            top3-kaart.html
            digests/
          "
          for f in $BESTANDEN; do
            if [ -e "$f" ]; then
              git add "$f" && echo "  toegevoegd: $f"
            else
              echo "  ONTBREEKT: $f"
            fi
          done

          if git diff --cached --quiet; then
            echo "Niets gewijzigd, niets te committen"
            exit 0
          fi

          git commit -m "Brief ${{ env.DATUM }}"

          # De repo kan intussen zijn veranderd, bijvoorbeeld door een upload.
          # Dan eerst ophalen en opnieuw proberen, anders gaat de commit verloren.
          for poging in 1 2 3; do
            if git push; then
              echo "Teruggecommit gelukt"
              exit 0
            fi
            echo "Push mislukt, poging $poging; repo ophalen en opnieuw"
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}" || true
            sleep 5
          done
          echo "LET OP: terugcommitten is niet gelukt. De gegevensbestanden van"
          echo "vandaag zijn daardoor verloren en morgen begint alles opnieuw."
          exit 1

          convert_markdown: false

      - name: Mail versturen
        if: ${{ hashFiles(format('digests/{0}-mail.html', env.DATUM)) != '' }}
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          from: Vastgoed in Nijmegen
          to: ${{ secrets.MAIL_TO }}
          cc: ${{ secrets.MAIL_TO_VERHAAL }}
          subject: Vastgoed in Nijmegen, ${{ env.DATUM }}
          html_body: file://digests/${{ env.DATUM }}-mail.html

      # Vangnet: is het samenvoegen misgegaan, stuur dan alleen de werkbrief
      - name: Mail versturen zonder verhaal
        if: ${{ hashFiles(format('digests/{0}-mail.html', env.DATUM)) == '' && hashFiles(format('digests/{0}-brief.html', env.DATUM)) != '' }}
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          from: Vastgoed in Nijmegen
          to: ${{ secrets.MAIL_TO }}
          subject: Vastgoed in Nijmegen, ${{ env.DATUM }}
          html_body: file://digests/${{ env.DATUM }}-brief.html
