<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Potentie van de ring</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<style>
  :root{
    --open:#3E8E6E; --dicht:#C9756B; --kamer:#6B5CA5; --klein:#B7C0C4;
    --vvE:#D6A85C; --label:#E0A458; --ink:#12242c; --zacht:#4a5b63;
    --sans:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
  }
  html,body{margin:0;height:100%;font-family:var(--sans);color:var(--ink);background:#fff}
  #map{position:absolute;inset:0}
  .paneel{position:absolute;top:12px;left:12px;z-index:1000;background:#fff;
    border-radius:10px;box-shadow:0 2px 12px rgba(0,0,0,.18);padding:12px 14px;max-width:290px;
    font-size:12.5px}
  .paneel h1{font-size:15px;margin:0 0 4px}
  .paneel p{margin:0 0 8px;color:var(--zacht)}
  .paneel label{display:flex;gap:6px;align-items:center;margin:4px 0;cursor:pointer}
  .paneel select{width:100%;margin:4px 0 6px;font:inherit;padding:3px}
  .legenda{margin-top:8px;border-top:1px solid #e6eaec;padding-top:6px}
  .rij{display:flex;align-items:center;gap:8px;margin:3px 0}
  .sw{width:12px;height:12px;border-radius:50%}
  .status{position:absolute;bottom:18px;right:12px;z-index:1000;background:#fff;
    border-radius:8px;box-shadow:0 2px 12px rgba(0,0,0,.18);padding:7px 11px;font-size:11.5px;color:var(--zacht)}
  .pop b{font-size:13px} .pop td{padding:1px 8px 1px 0;font-size:12px;vertical-align:top}
  .pop .ster{color:#B8860B;font-weight:700}
  @media (max-width:600px){ .paneel{max-width:calc(100% - 56px);font-size:12px} }
</style>
</head>
<body>
<div id="map"></div>

<div class="paneel">
  <h1>Potentie van de ring</h1>
  <p id="sub">Per woning welke routes openstaan, los van de prijs.</p>
  <select id="kleur">
    <option value="kamers">Kleur op: kamerverhuur</option>
    <option value="splitsen">Kleur op: splitsen</option>
    <option value="label">Kleur op: labelsprong E t/m G</option>
  </select>
  <label><input type="checkbox" id="tekoop"> Alleen wat te koop staat</label>
  <label><input type="checkbox" id="lijst"> Alleen de shortlist</label>
  <div class="legenda" id="legenda"></div>
  <p style="margin-top:8px">WOZ en indeling per etage zitten hier niet in; de shortlist toetst die bij verkoop. "Open" betekent: de buren blokkeren niet.</p>
</div>

<div class="status" id="status">Gegevens laden...</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
const KLEUREN = {
  kamers: {"open":"#3E8E6E","geblokkeerd":"#C9756B","al kamerpand":"#6B5CA5",
           "niet te toetsen":"#8A9AA1","te klein":"#B7C0C4"},
  splitsen: {"open":"#3E8E6E","via VvE":"#D6A85C","te klein":"#B7C0C4"},
  label: {"labelsprong":"#E0A458","geen sprong of onbekend":"#B7C0C4"}
};
const map = L.map("map", {preferCanvas:true, zoomControl:false}).setView([51.8422, 5.8556], 14);
L.control.zoom({position:"topright"}).addTo(map);
L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png",
  {maxZoom:19, attribution:"&copy; OpenStreetMap"}).addTo(map);
const laag = L.layerGroup().addTo(map);
const st = document.getElementById("status");
let woningen = [];

function klasse(w, soort){
  if(soort === "kamers") return w.k || "niet te toetsen";
  if(soort === "splitsen") return w.s || "te klein";
  return w.e ? "labelsprong" : "geen sprong of onbekend";
}
function esc(t){ return String(t ?? "").replace(/[&<>"]/g, c =>
  ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }
function popup(w){
  const rij = (k,v) => v===undefined||v===null||v==="" ? "" : `<tr><td>${k}</td><td>${esc(v)}</td></tr>`;
  return `<div class="pop"><b>${esc(w.a)}</b>${w.f ? ` <span class="ster">shortlist ${String(w.f).replace(".",",")}× jaarhuur</span>` : ""}
    <table>${rij("Buurt", w.b)}${rij("Oppervlakte", w.m ? w.m+" m²" : "")}${rij("Bouwjaar", w.j)}
    ${rij("Label", w.l)}${rij("Kamers", (w.k||"") + (w.r ? " ("+w.r+")" : ""))}
    ${rij("Splitsen", (w.s||"") + (w.n ? ", hoogstens "+w.n+" woningen" + (w.g ? " ("+w.g+" lagen)" : "") : ""))}${rij("Te koop", w.t ? "ja" : "")}</table></div>`;
}
function teken(){
  const soort = document.getElementById("kleur").value;
  const alleenKoop = document.getElementById("tekoop").checked;
  const alleenLijst = document.getElementById("lijst").checked;
  laag.clearLayers();
  let n = 0;
  for(const w of woningen){
    if(!w.p) continue;
    if(alleenKoop && !w.t) continue;
    if(alleenLijst && !w.f) continue;
    const kl = klasse(w, soort);
    const kleur = KLEUREN[soort][kl] || "#8A9AA1";
    const groot = w.f || w.t;
    L.circleMarker([w.p[1], w.p[0]], {
      radius: w.f ? 8 : (groot ? 6 : 3.5), weight: w.f ? 2.5 : (groot ? 1.5 : 0),
      color: w.f ? "#B8860B" : "#12242c", fillColor: kleur, fillOpacity: 0.85
    }).bindPopup(popup(w)).addTo(laag);
    n++;
  }
  const lg = document.getElementById("legenda");
  lg.innerHTML = Object.entries(KLEUREN[soort]).map(([k,c]) =>
    `<div class="rij"><span class="sw" style="background:${c}"></span>${k}</div>`).join("")
    + `<div class="rij"><span class="sw" style="background:#fff;border:2.5px solid #B8860B"></span>shortlist</div>`;
  st.textContent = `${n.toLocaleString("nl-NL")} woningen getoond`;
}
fetch("potentie_ring.json")
  .then(r => { if(!r.ok) throw new Error("antwoord " + r.status); return r.json(); })
  .then(d => {
    woningen = Object.values(d.woningen || {});
    document.getElementById("sub").textContent =
      `Per woning welke routes openstaan, los van de prijs. Bijgewerkt ${d.datum}.`;
    teken();
  })
  .catch(e => { st.textContent = "Gegevens niet te laden: " + e.message; });
for(const id of ["kleur","tekoop","lijst"])
  document.getElementById(id).addEventListener("change", teken);
</script>
</body>
</html>
